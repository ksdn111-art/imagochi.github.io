<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAGOCHI</title>
<meta name="apple-mobile-web-app-title" content="IMAGOCHI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7fe">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #f4f7fe; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #help { display: none; position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 2; padding: 12px 14px; border-radius: 14px;
    background: #141d47; color: #fff; font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; text-align: center; }
  #help a { color: #b8f0c8; font-weight: 700; }
</style>
</head>
<body>
<iframe id="app" title="IMAGOCHI" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div id="help">앱이 안 보이면 <a id="open" href="#" target="_top">여기를 눌러 바로 열기</a></div>
<script>
  // 학생 앱 주소 (바뀌면 여기만 고치세요)
  var APP = 'https://script.google.com/macros/s/AKfycbxfXkdoegVejQhygmBKaBRbGKNkKgpPQWIrIvtRlgTo89xPW1KmaMUL5JwylzUHtHLrpw/exec';
  var ready = false, help = document.getElementById('help');
  document.getElementById('open').href = APP;
  document.getElementById('app').src = APP;
  // 앱이 열리면 앱이 'ready' 신호를 보냄. 15초 안에 안 오면 바로 열기 안내를 보여 줌
  window.addEventListener('message', function (e) { if (e.data && e.data.imagochi === 'ready') { ready = true; help.style.display = 'none'; } });
  setTimeout(function () { if (!ready) help.style.display = 'block'; }, 15000);
</script>
</body>
</html>
